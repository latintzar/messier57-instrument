<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messier ’57 — Play the instrument</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body class="embedded">
<header><a href="../../README.md">ATELIER NEYRA</a><span>Messier ’57</span><a class="pd-download" href="downloads/messier57-pd-instrument.zip" download>Download Pd</a><button id="audio">Start audio <span></span></button></header>
<main><section class="intro"><div><h1>Messier ’57</h1></div><div class="intro-copy"><p>An acoustic drum with a playable snare model.</p><a href="#project">Source &amp; build files ↓</a></div></section>
<section class="instrument" aria-label="Playable Messier 57 instrument">
<div class="stage-column"><div class="stage-status sr-only"><span id="led"></span><span id="status" role="status" aria-live="polite">Enable sound to play</span><span id="model-status" class="sr-only">Loading model…</span></div>
<div id="scene" role="group" aria-label="CAD-derived 3D drum. Click the head or rim to play. Pull and hold the brass latch to loosen the snares."><img id="scene-fallback" src="assets/drum.png" alt="Reference reconstruction of the drum, showing wood shell, chrome hoop and fork-shaped brass spring latch"><button id="kick-key" class="kick-pad" aria-label="Play bass drum, K"><svg viewBox="0 0 120 85" aria-hidden="true"><path d="M31 62 22 78M81 61 92 78"/><path class="kick-shell" d="M32 23 59 15Q91 14 94 43Q94 67 67 72L38 67Z"/><ellipse cx="41" cy="46" rx="28" ry="28"/><ellipse cx="41" cy="46" rx="24" ry="24"/><path d="M41 50 50 72 68 77M50 72 59 62"/><circle cx="41" cy="48" r="4"/></svg><span><kbd>K</kbd> Kick</span></button><span id="hover-label" aria-hidden="true"></span></div>
<div class="key-controls"><button id="head-key" class="play-key"><kbd>H</kbd><span>Head</span></button><button id="rim-key" class="play-key"><kbd>R</kbd><span>Rim</span></button><button id="latch-key" class="play-key latch-key" aria-pressed="false"><kbd>S</kbd><span>Hold to loosen. <small id="latch-state" class="sr-only">Snares tight</small></span></button></div>
</div>
<aside class="control-panel"><div class="panel-title"><span>Where the sound works</span><i id="engine-light"></i></div>
<div class="switch-panel"><div class="switch-options" role="group" aria-label="Select which areas excite the synthesiser"><button class="zone" data-mode="head" aria-pressed="false"><i class="small-dot"></i><span>Head</span></button><button class="zone" data-mode="rim" aria-pressed="false"><i class="ring-dot"></i><span>Rim</span></button><button class="zone selected" data-mode="all" aria-pressed="true"><i class="large-dot"></i><span>Both</span></button></div><button id="switch-lever" class="switch-lever" aria-label="Cycle sensing switch; all areas"><span class="slot"></span><span id="lever-knob"></span></button></div>
<div class="latch-readout sr-only"><span>SPRING LATCH</span><output id="latch-value">At rest · tight</output><div class="latch-track"><i id="latch-meter"></i></div></div>

<div class="snare-control"><label id="snare-slider-label">Snares</label><div id="snare-amount" class="percent-control" role="slider" tabindex="0" aria-labelledby="snare-slider-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-orientation="vertical"><i></i><output>0%</output></div></div><div class="volume"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="35"><button id="stop">Stop</button></div><canvas hidden id="scope" width="520" height="100" role="img" aria-label="Live audio waveform"></canvas><p id="render-info" class="sr-only">Pure Data · original snare source</p>
</aside></section>
<section class="groove" aria-label="Drum sequencer"><div class="groove-top"><div><p class="overline" hidden></p><label class="sr-only" for="preset">Groove preset</label><select id="preset"><option value="baile">Baile groove</option></select></div><div class="tempo"><label for="tempo">Tempo <output id="tempo-value">130</output> BPM</label><input id="tempo" type="range" min="70" max="170" value="130"></div><button id="groove-play">Play beat</button></div><div id="pattern" class="pattern" role="group" aria-label="Editable drum sequencer"></div><p id="groove-status" class="sr-only" role="status" aria-live="polite"></p></section>

<div hidden id="engine-parameters"><input id="rattle" type="range" value="80"><output id="rattle-value">80</output><input id="tuning" type="range" value="60"><output id="tuning-value">60</output><input id="damping" type="range" value="60"><output id="damping-value">60</output><input id="velocity" type="range" value="65"><output id="velocity-value">65</output></div></main><footer><a href="https://atelierneyra.com" target="_blank" rel="noopener">made by atelier neyra</a></footer><script type="module" src="app.js"></script><script type="module" src="scene.js"></script></body></html>
